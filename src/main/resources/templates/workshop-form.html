<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${workshop != null} ? 'Edit workshop' : 'Add new workshop'">Workshop form</title>
    <style type="text/css">
        body {
            width: 600px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        label {
            display: inline-block;
            width: 160px;
            margin-top: 10px;
        }
        input, select {
            padding: 4px;
        }
        .actions {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<header>
    <h1 th:text="${workshop != null} ? 'Edit workshop' : 'Add new workshop'"></h1>
</header>
<main>
    <!-- Same form for both cases:
         - editing  -> POST /workshops/edit/{id}
         - adding   -> POST /workshops/add                        -->
    <form method="POST"
          th:action="${workshop != null}
                     ? @{/workshops/edit/{id}(id=${workshop.id})}
                     : @{/workshops/add}">

        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required
               th:value="${workshop?.title}"><br/>

        <label for="category">Category:</label>
        <input type="text" id="category" name="category" required
               th:value="${workshop?.category}"><br/>

        <label for="price">Price (MKD):</label>
        <input type="number" id="price" name="price" required min="0" step="0.01"
               th:value="${workshop?.price}"><br/>

        <label for="capacity">Number of seats:</label>
        <input type="number" id="capacity" name="capacity" required min="0"
               th:value="${workshop?.capacity}"><br/>

        <label for="instructorId">Instructor:</label>
        <select id="instructorId" name="instructorId" required>
            <option th:each="instructor : ${instructors}"
                    th:value="${instructor.id}"
                    th:text="${instructor.name + ' ' + instructor.surname}"
                    th:selected="${workshop != null
                                   and workshop.instructor != null
                                   and workshop.instructor.id == instructor.id}"></option>
        </select><br/>

        <div class="actions">
            <input type="submit"
                   th:value="${workshop != null} ? 'Save changes' : 'Add workshop'">
            <a href="/workshops">
                <button type="button">Cancel</button>
            </a>
        </div>
    </form>
</main>
</body>
</html>
